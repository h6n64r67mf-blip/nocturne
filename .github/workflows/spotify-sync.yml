name: Spotify Sync Cron

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger sync_all endpoint
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          SYNC_TRIGGER_TOKEN: ${{ secrets.SYNC_TRIGGER_TOKEN }}
        run: |
          curl -s -X POST "$SITE_URL/api/spotify/sync_all" -H "x-sync-token: $SYNC_TRIGGER_TOKEN" | jq .
