name: Cleanup Notifications

on:
  schedule:
    - cron: '0 4 * * *' # daily at 04:00 UTC
  workflow_dispatch: {}

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Cleanup notifications via API
        env:
          SITE_URL: ${{ secrets.SITE_URL }}
          MAINTENANCE_TOKEN: ${{ secrets.MAINTENANCE_TOKEN }}
        run: |
          curl -s -X POST "$SITE_URL/api/maintenance/cleanup" -H "x-admin-token: $MAINTENANCE_TOKEN" | jq .
